name: glotelho_livreur
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.3.13
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1


flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#0D1B2A"
  image: assets/images/glotelho_delivery_logo_high_contrast.png
  android_12:
    color: "#0D1B2A"
    image: assets/images/glotelho_delivery_logo_high_contrast.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/glotelho_delivery_logo_high_contrast.png"
  image_scale: 3
  adaptive_icon_background: "#0D1B2A"
  adaptive_icon_foreground: "assets/images/glotelho_delivery_logo_high_contrast.png"



