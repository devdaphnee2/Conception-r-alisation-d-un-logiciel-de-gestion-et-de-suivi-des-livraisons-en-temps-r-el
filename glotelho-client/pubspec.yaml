name: glotelho_client
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  provider: ^6.1.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_local_notifications: ^18.0.1
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.3.13
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#0D1B2A"
  image: assets/images/glotelho_express_logo_optimized.png
  android_12:
    color: "#0D1B2A"
    image: assets/images/glotelho_express_logo_optimized.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/glotelho_express_logo_optimized.png"
  image_scale: 3
  adaptive_icon_background: "#0D1B2A"
  adaptive_icon_foreground: "assets/images/glotelho_express_logo_optimized.png"