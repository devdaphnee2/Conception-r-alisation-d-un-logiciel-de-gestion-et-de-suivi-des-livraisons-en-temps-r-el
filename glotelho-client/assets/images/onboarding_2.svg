<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <!-- Fond carte -->
  <rect width="500" height="400" fill="white"/>
  
  <!-- Carte stylisée -->
  <rect x="60" y="40" width="380" height="260" rx="20" fill="#F2F4F7" stroke="#E0E0E0" stroke-width="2"/>
  
  <!-- Routes sur la carte -->
  <line x1="60" y1="160" x2="440" y2="160" stroke="#E0E0E0" stroke-width="8"/>
  <line x1="200" y1="40" x2="200" y2="300" stroke="#E0E0E0" stroke-width="8"/>
  <line x1="340" y1="40" x2="340" y2="300" stroke="#E0E0E0" stroke-width="8"/>
  <line x1="60" y1="230" x2="440" y2="230" stroke="#E0E0E0" stroke-width="8"/>
  
  <!-- Trajet doré animé -->
  <polyline points="120,270 120,160 200,160 200,100 340,100 340,160 380,160" 
    fill="none" stroke="#C8960C" stroke-width="4" stroke-dasharray="10,5"/>
  
  <!-- Bâtiments décoratifs -->
  <rect x="80" y="80" width="50" height="70" rx="4" fill="#0D1B2A" opacity="0.15"/>
  <rect x="90" y="90" width="10" height="10" rx="1" fill="white" opacity="0.5"/>
  <rect x="105" y="90" width="10" height="10" rx="1" fill="white" opacity="0.5"/>
  <rect x="90" y="108" width="10" height="10" rx="1" fill="white" opacity="0.5"/>
  <rect x="105" y="108" width="10" height="10" rx="1" fill="white" opacity="0.5"/>
  
  <rect x="370" y="170" width="40" height="55" rx="4" fill="#0D1B2A" opacity="0.15"/>
  <rect x="378" y="178" width="8" height="8" rx="1" fill="white" opacity="0.5"/>
  <rect x="394" y="178" width="8" height="8" rx="1" fill="white" opacity="0.5"/>
  
  <!-- Point de départ -->
  <circle cx="120" cy="270" r="10" fill="#0D1B2A"/>
  <circle cx="120" cy="270" r="5" fill="white"/>
  
  <!-- Pin de destination -->
  <ellipse cx="380" cy="167" rx="8" ry="3" fill="#C8960C" opacity="0.3"/>
  <path d="M380 140 C372 140 366 146 366 154 C366 165 380 175 380 175 C380 175 394 165 394 154 C394 146 388 140 380 140Z" fill="#C8960C"/>
  <circle cx="380" cy="154" r="5" fill="white"/>
  
  <!-- Livreur (scooter) sur la carte -->
  <g transform="translate(195,92)">
    <circle cx="0" cy="-18" r="14" fill="#0D1B2A"/>
    <text x="0" y="-14" text-anchor="middle" fill="#C8960C" font-size="14" font-weight="bold">G</text>
    <path d="M-6 -4 L6 -4 L8 4 L-8 4Z" fill="#0D1B2A"/>
    <!-- Roues -->
    <circle cx="-8" cy="8" r="5" fill="#0D1B2A"/>
    <circle cx="8" cy="8" r="5" fill="#0D1B2A"/>
  </g>
  
  <!-- Onde de signal autour du livreur -->
  <circle cx="200" cy="100" r="22" fill="none" stroke="#C8960C" stroke-width="2" opacity="0.6"/>
  <circle cx="200" cy="100" r="32" fill="none" stroke="#C8960C" stroke-width="1.5" opacity="0.4"/>
  <circle cx="200" cy="100" r="42" fill="none" stroke="#C8960C" stroke-width="1" opacity="0.2"/>

  <!-- Téléphone en bas -->
  <rect x="170" y="300" width="160" height="85" rx="16" fill="#0D1B2A"/>
  <rect x="178" y="308" width="144" height="62" rx="10" fill="#1A2D42"/>
  <!-- Mini carte dans le téléphone -->
  <rect x="182" y="312" width="136" height="50" rx="8" fill="#C8D8F0"/>
  <circle cx="250" cy="337" r="8" fill="#C8960C"/>
  <text x="250" y="341" text-anchor="middle" fill="white" font-size="8" font-weight="bold">G</text>
  <path d="M230 337 L244 337" stroke="white" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="225" cy="337" r="4" fill="#0D1B2A"/>
  <!-- Indicateur ETA -->
  <rect x="190" y="350" width="55" height="16" rx="8" fill="#0D1B2A"/>
  <text x="217" y="361" text-anchor="middle" fill="#C8960C" font-size="7" font-weight="bold">ETA 12 min</text>
</svg>
